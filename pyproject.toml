[tool.poetry]
name = "DocDig"
version = "0.1.0"
description = ""
authors = ["Benedikt Veith <bv@scherer-software.de>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

pathlib = "^1.0.1"
pdf2image = "^1.17.0"
tensorflow = "^2.17.0"
ipython = "^8.28.0"
opencv-python = "^4.10.0.84"
python-dotenv = "^1.0.1"
pandas = "^2.2.3" 
numpy = "^1.24.2"

torch = "^2.3.0"
torchvision = "^0.18.0"
scikit-learn = "^1.2.1"
tqdm = "^4.65.0"
Cython = "^0.29.33"
matplotlib = "^3.7.0"
pycocotools = "^2.0.6"
Pillow = "^9.4.0"
editdistance = "^0.8.1"
scikit-image = "^0.20.0"
scipy = "^1.10.1"
PyMuPDF = "^1.21.1"
streamlit = "^1.49.1"
streamlit-pdf-viewer = "^0.0.26"
streamlit-float = "^0.3.5"
fleep = "^1.0.1"
pytesseract = "^0.3.13"
transformers = "^4.56.1"
rapidfuzz = "^3.14.1"
watchdog = "^6.0.0"
# Core + contrib MUST stay on the same version — mixed installs produce a
# broken hybrid cv2 (ultralytics pulls opencv-python if unconstrained).
opencv-contrib-python = "4.12.0.88"
timm = "^1.0.15"
ultralytics = "^8.4.87"
truststore = "^0.10.1"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"
pytest = "^9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that load real scans + models (slow)",
]
# Run the fast deterministic suite by default; opt in to integration with
# `pytest -m integration` (or `pytest -m ''` for everything).
addopts = "-m 'not integration'"
