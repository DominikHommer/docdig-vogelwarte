deploy:
  stage: deploy
  image: alpine:latest
  timeout: 5m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        # Login to registry
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.vogelwarte.ch
        
        # Pull latest image
        docker pull $IMAGE_NAME:latest
        
        # Stop and remove existing container
        docker stop docdig || true
        docker rm docdig || true
        
        # Start new container
        docker run -d --name docdig -p 8501:8501 --restart unless-stopped $IMAGE_NAME:latest
        
        # Clean up old images
        docker image prune -f
      "
  environment:
    name: production
  only:
    - main
  when: manual