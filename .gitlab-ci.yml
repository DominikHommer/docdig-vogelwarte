stages:
  - build
  - health-check
  - promote
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain
  IMAGE_NAME: registry.vogelwarte.ch/$CI_PROJECT_PATH

services:
  - docker:dind

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  - docker pull $IMAGE_NAME:latest || true

build:
  stage: build
  image: docker:latest
  timeout: 2 hours
  script:
    # Build the image with cache
    - docker build --cache-from $IMAGE_NAME:latest --build-arg BUILDKIT_INLINE_CACHE=1 -f docker/Dockerfile -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    
    # Tag as latest if on main branch
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:latest
      fi
    
    # Push all tags
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker push $IMAGE_NAME:latest
      fi
  only:
    - main
    - testing
  tags:
    - docker

health-check:
  stage: health-check
  image: docker:latest
  timeout: 5m
  script:
    # Run container for health check
    - docker run -d --name docdig-test -p 8502:8501 $IMAGE_NAME:$CI_COMMIT_SHA
    - sleep 15
    # Check if container is healthy with retry logic
    - |
      for i in {1..5}; do
        if docker ps | grep docdig-test && docker exec docdig-test curl --fail --max-time 10 http://localhost:8501/_stcore/health; then
          echo "Health check passed"
          break
        fi
        if [ $i -eq 5 ]; then
          echo "Health check failed after 5 attempts"
          exit 1
        fi
        echo "Health check attempt $i failed, retrying in 5s..."
        sleep 5
      done
    # Clean up test container
    - docker stop docdig-test
    - docker rm docdig-test
  only:
    - main
    - testing
  tags:
    - docker

promote_to_testing:
  stage: promote
  image: docker:latest
  script:
    # Tag existing image as testing
    - docker tag $IMAGE_NAME:latest $IMAGE_NAME:testing
  only:
    - testing
  when: manual
  tags:
    - docker

promote_to_production:
  stage: promote
  image: docker:latest
  script:
    # Tag existing image as production
    - docker tag $IMAGE_NAME:latest $IMAGE_NAME:production
  only:
    - production
  when: manual
  tags:
    - docker

deploy_testing:
  stage: deploy
  image: alpine:latest
  timeout: 5m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        # Login to registry
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.vogelwarte.ch
        
        # Pull testing image
        docker pull $IMAGE_NAME:testing
        
        # Stop and remove existing testing container
        docker stop docdig-testing || true
        docker rm docdig-testing || true
        
        # Start new testing container on port 8502
        docker run -d --name docdig-testing -p 8502:8501 --restart unless-stopped $IMAGE_NAME:testing
        
        # Clean up old images
        docker image prune -f
      "
  environment:
    name: testing
    url: http://$DEPLOY_HOST:8502
  only:
    - testing
  when: manual

deploy_production:
  stage: deploy
  image: alpine:latest
  timeout: 5m
  needs:
    - promote_to_production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        # Login to registry
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.vogelwarte.ch
        
        # Pull production image
        docker pull $IMAGE_NAME:production
        
        # Stop and remove existing production container
        docker stop docdig-production || true
        docker rm docdig-production || true
        
        # Start new production container on port 8501
        docker run -d --name docdig-production -p 8501:8501 --restart unless-stopped $IMAGE_NAME:production
        
        # Clean up old images
        docker image prune -f
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST:8501
  only:
    - production
  when: manual